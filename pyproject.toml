[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[project]
name = "whole_body_control"
version = "0.1.0"
description = "Whole-body control for the VITA BOY humanoid robot."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "mjlab[cu128]>=1.2.0",
    "onnxruntime>=1.23.0",
    "pynput>=1.8.1",
    "pyyaml>=6.0.3",
]

[project.entry-points."mjlab.tasks"]
whole_body_control = "whole_body_control.tasks"

[dependency-groups]
dev = [
    "black==23.10.1",
    "codespell==2.2.6",
    "flake8==6.1.0",
    "flake8-return",
    "flake8-simplify",
    "isort==5.12.0",
    "pre-commit==4.5.0",
    "pyupgrade==3.15.0",
    "ruff==0.14.6",
]

[tool.isort]
atomic = true
profile = "black"
line_length = 120
py_version = 3
skip_glob = ["docs/*", "logs/*", "wandb/*", "outputs/*"]
group_by_package = true
known_firstparty = "whole_body_control"
known_local_folder = "config"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
